<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Pak Tegas · Meja Kerja</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1412;--sf:#151E1B;--up:#1C2723;--ln:#26332E;--ln2:#1F2B27;--tx:#EEF2EC;--mu:#9DAAA3;--mu2:#C9D2CC;--dim:#6F7D76;
  --ac:#5ED3A5;--ac2:#8BE3C0;--acbg:#1F3A31;--au:#E4B860;--bad:#FF8A7A;--warn:#F2B04C;--warnbg:#2A2113;--warnln:#4A3A1C;--lock:#3A4A44;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --safe-t:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Tinggi mengikuti jendela Mini App yang sebenarnya. Dulu memakai --tg-viewport-stable-height: angka itu tertinggal di tinggi
   bilah kecil sesudah aplikasi diperkecil lalu dibuka lagi di Android, sehingga hanya potongan atas yang tampil (laporan 11 Nov 2026). */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t);max-width:560px;margin:0 auto}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 12px;display:flex;flex-direction:column;gap:16px}
.view.tight{padding-top:4px}
.view>*{flex-shrink:0}
.dock{padding:8px 20px 12px;display:flex;gap:10px}
.dock.last{padding-bottom:calc(12px + var(--safe-b))}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln2);background:var(--bg);padding:6px 8px calc(10px + var(--safe-b))}
.nav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--mu);font-size:11px;font-weight:600}
.nav button[aria-current=page]{color:var(--tx);font-weight:700}
.nav button[aria-current=page] svg{stroke:var(--ac);stroke-width:2}
.disp{font-family:var(--disp)}
.num{font-variant-numeric:tabular-nums}
.h-title{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:-.01em;margin:0}
.card{border-radius:20px;padding:16px;background:var(--sf);border:1px solid var(--ln)}
.card.big{border-radius:24px;padding:20px}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}
.small{font-size:12px}.s13{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.btn{min-height:54px;border-radius:16px;border:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;padding:0 16px}
.btn.pri{background:var(--ac);color:var(--bg);flex:1}
.btn.pri:active{background:var(--ac2)}
.btn.sec{background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx);font-weight:600;flex:1}
.btn.light{background:var(--tx);color:var(--bg);flex:1;font-size:15px}
.btn.sq{width:54px;flex:none;padding:0}
.btn[disabled]{opacity:.5;cursor:default}
.btn .sub{font-size:13px;font-weight:600;opacity:.75;white-space:nowrap}
.md hr{border:0;height:1px;background:var(--ln);margin:4px 0;width:100%}
.row{display:flex;align-items:center;gap:12px}
.row>svg,.dlrow>svg{flex:none}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:22px;font-size:13px;font-weight:600;background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip .cap{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:var(--up);color:var(--mu)}
.chip[aria-pressed=true] .cap{background:var(--bg);color:var(--au)}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;margin-left:-12px}
.tgback .back{display:none}
.topbar{display:flex;align-items:center;gap:4px;padding:8px 12px 0 20px}
.skel{border-radius:20px;background:linear-gradient(90deg,var(--sf),var(--up),var(--sf));background-size:200% 100%;animation:sh 1.2s infinite linear;border:1px solid var(--ln)}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--up);border:1px solid var(--ln);color:var(--tx);padding:12px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 40px);z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:80vh;overflow-y:auto;background:var(--sf);border:1px solid var(--ln);border-radius:24px 24px 0 0;padding:12px 20px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--ln);align-self:center;margin-bottom:8px}
.opt-row{min-height:52px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:14px;background:var(--up);border:1px solid var(--ln);color:var(--tx);font-size:15px}
.opt-row[aria-current=true]{border-color:var(--ac);background:var(--acbg)}
.empty{text-align:center;padding:40px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* beranda */
.avatar{width:40px;height:40px;border-radius:20px;background:var(--up);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--au)}
.pill{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:22px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);font-size:13px;font-weight:600}
.banner{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);font-size:13px;text-align:left;width:100%}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ac);flex:none}
.rankcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.seal-r{position:absolute;right:-18px;top:-18px;width:112px;height:112px;border-radius:56px;border:2px solid #E4B86055;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.seal-r>div{width:92px;height:92px;border-radius:46px;border:1px dashed #E4B86077;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.12em;color:#E4B86099;line-height:1.3}
.rankname{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;max-width:75%}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.ladder div{height:6px;border-radius:3px;background:var(--ln)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bignum{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mis{display:flex;align-items:center;gap:12px;font-size:14px}
.mis .ck{width:22px;height:22px;border-radius:11px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.mis .ring{width:20px;height:20px;border-radius:10px;border:2px solid var(--lock);flex:none;margin:0 1px}
.mis.done .lbl{color:var(--mu);text-decoration:line-through}
/* materi */
.prog{flex:1;height:4px;border-radius:2px;background:var(--ln)}
.prog>div{height:100%;border-radius:2px;background:var(--ac)}
.md{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.6;color:var(--mu2)}
.md h1{margin:0;font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.15;color:var(--tx)}
.md h3{margin:8px 0 0;font-size:16px;font-weight:700;color:var(--tx)}
.md p{margin:0}
.md strong{color:var(--tx)}
.md ul,.md ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--up);padding:1px 5px;border-radius:6px;color:var(--tx)}
.md pre{margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;overflow-x:auto;font-size:13px;line-height:1.5;color:var(--tx)}
.md pre code{background:none;padding:0}
.tbl{border-radius:20px;background:var(--sf);border:1px solid var(--ln);overflow:hidden}
.tbl .scroll{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4}
.tbl th{text-align:left;padding:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);background:var(--up);white-space:nowrap}
.tbl td{padding:12px;border-top:1px solid var(--ln2);color:var(--tx);vertical-align:top;min-width:140px}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;min-width:104px;max-width:150px;font-weight:600;font-size:13px;color:var(--mu2);box-shadow:1px 0 0 var(--ln)}
.tbl th:first-child{background:var(--up)}
.tbl.narrow td:first-child{position:static;box-shadow:none}
.tbl .hint{padding:8px 16px;font-size:12px;color:var(--dim);border-top:1px solid var(--ln2)}
.warncard{display:flex;gap:14px;align-items:flex-start;border-radius:20px;padding:16px;background:var(--warnbg);border:1px solid var(--warnln)}
.warncard .t{font-size:14px;font-weight:700;color:#F6D08A}
.warncard ul{color:#E6DCC8;font-size:14px;line-height:1.55;padding-left:18px}
/* tabel AI */
.bubble{align-self:flex-end;max-width:82%;padding:12px 16px;border-radius:18px 18px 6px 18px;background:var(--up);font-size:14px;line-height:1.5}
.tg{white-space:pre-wrap;font-size:15px;line-height:1.6;color:var(--mu2);overflow-wrap:anywhere}
.tg b{color:var(--tx)}
.tg blockquote{margin:6px 0;padding:12px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.tg pre{margin:6px 0;white-space:pre;overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;font-size:13px;color:var(--tx)}
.tg code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--up);padding:1px 5px;border-radius:6px;color:var(--tx)}
.tg pre code{background:none;padding:0}
.tg .spoiler{background:var(--mu);color:transparent;border-radius:4px;cursor:pointer}
.tg .spoiler.open{background:none;color:inherit}
/* rapor */
.capb{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.capb.done{background:var(--au);color:var(--bg);box-shadow:inset 0 0 0 3px #0D141233,inset 0 0 0 5px var(--au)}
.capb.lock{border:1.5px dashed var(--lock);color:var(--lock)}
.stamps{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.stamps::-webkit-scrollbar{display:none}
.stamp{width:54px;height:64px;padding:4px;flex:none;border-radius:6px;border:2px dotted var(--bg);background:var(--up);box-shadow:0 0 0 2px var(--up)}
.stamp>div{width:100%;height:100%;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px dashed var(--lock);color:#5B6B64}
.stamp.got{background:var(--au);box-shadow:0 0 0 2px var(--au)}
.stamp.got>div{border:1px solid #0D141266;color:var(--bg)}
.linkcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--tx)}
/* simulasi */
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 .v{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1.1}
.qgrid{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.qgrid::-webkit-scrollbar{display:none}
.qn{flex:none;width:44px;height:44px;border-radius:12px;font-size:14px;font-weight:700;background:var(--sf);color:var(--mu);border:1px solid var(--ln)}
.qn.ans{background:var(--acbg);color:var(--ac2);border-color:var(--acbg)}
.qn.cur{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.qn.rg{box-shadow:inset 0 -4px 0 var(--warn)}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:58px;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.45;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);width:100%}
.opt .L{flex:none;width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:var(--up);color:var(--mu)}
.opt[aria-pressed=true]{background:var(--acbg);border-color:var(--ac)}
.opt[aria-pressed=true] .L{background:var(--ac);color:var(--bg)}
.ragu{min-height:54px;padding:0 16px;border-radius:16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.ragu[aria-pressed=true]{background:var(--warnbg);border:1.5px solid var(--warn);color:var(--warn)}
.timer{font-family:var(--disp);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tbar{height:4px;border-radius:2px;background:var(--ln)}
.tbar>div{height:100%;border-radius:2px;background:var(--ac);transition:width .9s linear}
.low .timer{color:var(--bad)} .low .tbar>div{background:var(--bad)}
.seal{position:absolute;right:18px;top:26px;width:104px;height:104px;border-radius:52px;border:3px solid currentColor;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg) scale(.6);opacity:0;animation:stampin .45s .25s cubic-bezier(.2,1.4,.4,1) forwards}
.seal>div{width:86px;height:86px;border-radius:43px;border:1.5px dashed currentColor;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;font-family:var(--disp);font-weight:800;letter-spacing:.08em;line-height:1.1}
@keyframes stampin{to{transform:rotate(-14deg) scale(1);opacity:.95}}
@media (prefers-reduced-motion:reduce){.seal{animation:none;opacity:.95;transform:rotate(-14deg)}.skel{animation:none}.tbar>div{transition:none}}
.rv{display:flex;flex-direction:column;gap:8px}
/* riwayat simulasi (T6) */
.srow{min-height:64px;border-radius:18px;padding:10px 14px 10px 10px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx)}
.srow.old{min-height:56px;background:transparent;border:1px dashed var(--ln);color:var(--mu);cursor:default}
.dtab{flex:none;width:44px;height:46px;border-radius:12px;background:var(--up);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.srow.old .dtab{background:none;height:40px}
.dtab b{font-family:var(--disp);font-size:18px;font-weight:800;line-height:1}
.srow.old .dtab b{font-size:16px;font-weight:700}
.dtab i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mu)}
.srow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.srow .sc{font-family:var(--disp);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.srow.old .sc{font-size:20px;font-weight:700;padding-right:22px}
.statn{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700}
/* duel */
.dl-seal{position:absolute;right:-14px;top:-14px;width:104px;height:104px;border-radius:52px;border:2px solid #E4B86055;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.dl-seal>div{width:86px;height:86px;border-radius:43px;border:1px dashed #E4B86077;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.12em;color:#E4B86099;line-height:1.3}
.rec{display:flex;align-items:baseline;gap:18px}.rec>div{display:flex;flex-direction:column}
.rec .v{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dlrow{border-radius:20px;padding:14px 14px 14px 16px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx)}
.dlrow .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.dlbtn{min-height:44px;padding:0 16px;border-radius:14px;border:0;background:var(--ac);color:var(--bg);font-size:14px;font-weight:700;flex:none}
.dlbtn.soft{background:var(--acbg);color:var(--ac2)}
.hist{border-radius:16px;padding:12px 16px;min-height:44px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx)}
.hist .o{font-size:12px;font-weight:800;width:62px;flex:none}
.tpk{min-height:48px;border-radius:14px;font-size:14px;font-weight:700;background:var(--sf);border:1.5px solid var(--ln);color:var(--mu2)}
.tpk[aria-pressed=true]{background:var(--acbg);border-color:var(--ac);color:var(--tx)}
.stepn{flex:none;width:24px;height:24px;border-radius:12px;background:var(--up);color:var(--au);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:24px 0 8px}
.vs>div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vs .av{width:72px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:24px;font-weight:800}
.dopt{display:flex;gap:14px;align-items:center;text-align:left;min-height:56px;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.45;width:100%;background:var(--sf);border:1.5px solid var(--ln);color:var(--tx)}
.dopt .L{flex:none;width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:var(--up);color:var(--mu)}
.dopt.right{background:var(--acbg);border-color:var(--ac)}.dopt.right .L{background:var(--ac);color:var(--bg)}
.dopt.wrong{background:#2E1A17;border-color:var(--bad)}.dopt.wrong .L{background:var(--bad);color:var(--bg)}
.dopt.dim{background:#111916;border-color:var(--ln2);color:#8A9891}
.dseal{width:112px;height:112px;border-radius:56px;border:3px solid currentColor;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg)}
.dseal>div{width:94px;height:94px;border-radius:47px;border:1.5px dashed currentColor;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.08em}
.score2{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.score2 .big{font-family:var(--disp);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tgprev{border-radius:18px;background:#182533;border:1px solid #22344A;padding:12px;display:flex;flex-direction:column;gap:10px}
/* kesalahan */
.kitem{border-radius:20px;background:var(--sf);border:1px solid var(--ln);overflow:hidden}
.kitem>button{width:100%;text-align:left;background:none;border:0;padding:16px;display:flex;flex-direction:column;gap:10px}
.kline{display:flex;gap:8px;align-items:baseline;font-size:13px}

<script>

// ---------- Beranda ----------
function greet() { var h = new Date().getHours(); return h < 11 ? 'Selamat pagi,' : h < 15 ? 'Selamat siang,' : h < 18 ? 'Selamat sore,' : 'Selamat malam,'; }

      m.missions.map(function (x) {

function sheet(inner, bind) {
  var bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div>';
  document.body.appendChild(bg);
  var prevBack = backFn;
  var close = function () { bg.remove(); setBack(prevBack); };
  bg.onclick = function (e) { if (e.target === bg) close(); };
  setBack(close);
  bind(bg, close);
}
function tingkatSheet() {

  sheet('<span class="disp" style="font-size:22px;font-weight:800;margin-bottom:4px">Pilih tingkat UKP</span><span class="s13 mu" style="margin-bottom:8px">Progres tiap tingkat tersimpan terpisah.</span>' +

// ---------- Markdown materi ----------
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(^|[\s(])\*(\S[^*]*?)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>');
}
var isRow = function (l) { return /^\s*\|.*\|\s*$/.test(l); };
var isSep = function (l) { return /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && /-/.test(l); };
function tableHtml(lines, cellFn) {
  var rows = lines.filter(function (l) { return !isSep(l); }).map(function (l) { return l.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); });
  if (!rows.length) return '';
  var head = rows[0], body = rows.slice(1), cols = head.length;
  return '<div class="tbl' + (cols <= 2 ? ' narrow' : '') + '"><div class="scroll"><table><thead><tr>' + head.map(function (c) { return '<th>' + cellFn(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    body.map(function (r) { var out = ''; for (var i = 0; i < cols; i++) out += '<td>' + cellFn(r[i] || '') + '</td>'; return '<tr>' + out + '</tr>'; }).join('') +
    '</tbody></table></div>' + (cols > 2 ? '<div class="hint">Geser tabel ke samping untuk melihat semua kolom</div>' : '') + '</div>';
}
function mdRender(md) {
  var lines = String(md || '').split('\n'), out = [], i = 0, list = null, para = [];
  function flushPara() { if (para.length) { out.push('<p>' + para.map(inline).join(' ') + '</p>'); para = []; } }
  function flushList() { if (list) { out.push('<' + list.t + '>' + list.items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; } }
  while (i < lines.length) {
    var ln = lines[i];
    if (/^\s*```/.test(ln)) {
      flushPara(); flushList();
      var code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
    }
    if (isRow(ln)) {
      flushPara(); flushList();
      var t = []; while (i < lines.length && isRow(lines[i])) t.push(lines[i++]);
      out.push(tableHtml(t, inline)); continue;
    }
    var jb = ln.match(/^\s*\*\*((?:Jebakan|Awas|Hati-hati|Perhatian)[^*]*)\*\*\s*:?\s*$/i);
    if (jb) {
      flushPara(); flushList();
      var items = []; i++;
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (!lines[i].trim() && items.length === 0))) { if (lines[i].trim()) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')); i++; }
      out.push('<section class="warncard">' + ic('warn', 22, '#F2B04C', 2) + '<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="t">' + inline(jb[1]) + '</span>' +
        (items.length ? '<ul style="margin:0;display:flex;flex-direction:column;gap:6px">' + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>' : '') + '</div></section>');
      continue;
    }
    var h = ln.match(/^#{1,6}\s+(.*)$/);
    if (h) { flushPara(); flushList(); out.push('<h3>' + inline(h[1]) + '</h3>'); i++; continue; }
    var li = ln.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      flushPara();
      var tt = /\d/.test(li[1]) ? 'ol' : 'ul';
      if (!list || list.t !== tt) { flushList(); list = { t: tt, items: [] }; }
      list.items.push(li[2]); i++; continue;
    }
    if (/^\s*>\s?/.test(ln)) { flushPara(); flushList(); out.push('<blockquote class="card" style="margin:0">' + inline(ln.replace(/^\s*>\s?/, '')) + '</blockquote>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { flushPara(); flushList(); out.push('<hr>'); i++; continue; }
    if (!ln.trim()) { flushPara(); flushList(); i++; continue; }
    if (list && /^\s{2,}\S/.test(ln)) { list.items[list.items.length - 1] += ' ' + ln.trim(); i++; continue; }
    flushList(); para.push(ln.trim()); i++;
  }
  flushPara(); flushList();
  return out.join('');
}

// ---------- Materi ----------

  if (!S.me) api('me').then(function (d) { S.me = d; }).catch(function () {});
  void need;
}
function showMateri(arg) {

// ---------- Tabel jawaban AI ----------
var ALLOWED = /^<\/?(b|i|u|s|code|pre|tg-spoiler)>$|^<blockquote( expandable)?>$|^<\/blockquote>$|^<code class="language-[a-z0-9_-]{1,20}">$/;
function allowTg(s) {
  var out = '', re = /<[^<>]{1,40}>/g, last = 0, m;
  var et = function (t) { return t.replace(/&(?!(amp|lt|gt|quot);)/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  while ((m = re.exec(s))) {
    out += et(s.slice(last, m.index));
    var tag = m[0];
    if (ALLOWED.test(tag)) {
      if (tag === '<tg-spoiler>') tag = '<span class="spoiler" role="button" tabindex="0">';
      else if (tag === '</tg-spoiler>') tag = '</span>';
      else if (/^<blockquote/.test(tag)) tag = '<blockquote>';
      else if (/^<code class/.test(tag)) tag = '<code>';
      out += tag;
    } else out += et(tag);
    last = m.index + m[0].length;
  }
  return out + et(s.slice(last));
}
function tgRender(html) {
  var lines = String(html || '').split('\n'), out = [], buf = [], i = 0;
  function flush() { if (buf.length) { var t = buf.join('\n').replace(/^\n+|\n+$/g, ''); if (t) out.push('<div class="tg">' + allowTg(t).replace(/\n*(<\/?(blockquote|pre)>)\n*/g, '$1') + '</div>'); buf = []; } }
  while (i < lines.length) {
    if (isRow(lines[i])) {
      flush();
      var t = []; while (i < lines.length && isRow(lines[i])) t.push(lines[i++]);
      out.push(tableHtml(t, function (c) { return allowTg(c.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')); }));
      continue;
    }
    buf.push(lines[i++]);
  }
  flush();
  return out.join('');
}

  if (rv) {
    var verdict = rv.timeout ? 'Waktu habis, dihitung salah' : rv.ok ? 'Benar · ' + rv.t + ' detik' : 'Salah · jawaban benar ' + L[rv.right];
    var ol = rv.opp ? esc(q.oppName) + ': ' + (rv.opp.timeout ? 'waktu habis' : (rv.opp.ok ? 'benar' : 'salah') + ' · ' + rv.opp.t + ' detik') : '';
    v += '<section class="card" style="border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><span style="font-size:15px;font-weight:800;color:' + (rv.ok ? 'var(--ac)' : 'var(--bad)') + '">' + verdict + '</span>' +
      (ol ? '<span class="s13" style="color:var(--au);font-weight:600">' + ol + '</span>' : '') +
      '<span class="s13 mu" style="line-height:1.5;white-space:pre-wrap">' + esc(rv.explain) + (rv.basis ? '\n<i>Dasar: ' + esc(rv.basis) + '</i>' : '') + '</span></section>';
  }
  var dock = rv ? '<button class="btn light" id="dnext">' + (rv.last ? 'Lihat hasil' : 'Soal berikutnya') + '</button>' : '<span class="s13 mu" style="flex:1;text-align:center;padding:16px 0">Pilih jawaban sebelum waktu habis</span>';
  frame(v, dock, { nav: false, top: top });
  setBack(null);
  if (!rv) dlRing(dlLeft()); else { var rc = document.getElementById('ringc'); if (rc) { rc.setAttribute('stroke-dasharray', '0 144.5'); document.getElementById('ringt').textContent = rv.t; } }
  if (!rv) app.querySelectorAll('[data-o]').forEach(function (b) { b.onclick = function () { dlAnswer(Number(b.getAttribute('data-o'))); }; });
  var n = document.getElementById('dnext');
  if (n) n.onclick = function () { hap('light'); if (rv.last) dlAfter(); else dlNextQ(); };
}
function dlAnswer(pick) {
  if (!DL.q || DL.rv || DL.busy) return;
  DL.busy = true; dlStop();
  if (pick != null) hap('sel');
  var q = DL.q;
  var attempt = function (n) {
    api('duel/answer', { c: DL.code, i: q.i, pick: pick }).then(function (rv) {
      DL.busy = false; DL.rv = rv; hap(rv.ok ? 'ok' : 'error'); renderQ();
    }).catch(function (e) {
      if (n < 2 && e.status !== 409) return setTimeout(function () { attempt(n + 1); }, 1200);
      DL.busy = false;
      if (e.status === 409) return dlNextQ(); // server sudah maju (mis. waktu habis) -> ambil soal berikutnya
      errorView(e, function () { attempt(0); });
    });
  };
  attempt(0);
}
// keluar aplikasi saat soal tampil -> dicatat
document.addEventListener('visibilitychange', function () {
  if (!document.hidden || !DL.q || DL.rv || !DL.tick || !DL.code) return;
  try { fetch(API + 'duel/away', { method: 'POST', keepalive: true, headers: { 'x-tg-init': INIT, 'content-type': 'application/json' }, body: JSON.stringify({ c: DL.code, i: DL.q.i }) }); } catch (e) {}
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && DL.tick && DL.q && !DL.rv && dlLeft() <= 0) { dlStop(); dlAnswer(null); } });
function dlAfter() {
  dlStop(); DL.q = null; DL.rv = null; DL.lobby = null;
  openDuelOne(DL.code);
}

// Tantang langkah 2: giliran selesai
function renderSelesai() {
  var d = DL.one;
  var v = '<h1 class="h-title">Giliranmu selesai</h1>' +
    '<section class="card big" style="position:relative;padding:24px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden">' +
      '<span class="eyebrow" style="font-size:12px;letter-spacing:.14em">Skormu · ' + esc(d.topic) + '</span>' +
      '<span class="disp num" style="font-size:64px;font-weight:800;line-height:1">' + d.my.score + '<span style="font-size:28px;color:var(--mu)">/5</span></span>' +
      '<span class="s13 mu">waktu total ' + esc(d.my.timeText) + '</span>' +
      '<div class="dseal" style="position:absolute;right:18px;top:22px;width:96px;height:96px;color:var(--mu);transform:rotate(-12deg)" aria-hidden="true"><div style="width:80px;height:80px;font-size:12px">RAHASIA</div></div></section>' +
    '<section class="card row" style="align-items:flex-start">' + ic('lock', 22, '#E4B860') + '<span style="font-size:14px;line-height:1.5;color:var(--mu2)">Temanmu tidak bisa melihat skor ini sampai ia selesai main. Jadi ia tidak tahu harus mengejar berapa.</span></section>' +
    (d.accepted && d.accepted.length ? '<span class="s13 mu">Sudah diterima: ' + d.accepted.map(function (a) { return esc(a.name) + (a.done ? ' (selesai)' : ''); }).join(', ') + '</span>' : '') +
    (d.open ? '' : '<span class="s13" style="color:var(--warn)">Batas 24 jam sudah lewat. Buat tantangan baru dari lobi.</span>');
  frame(v, d.open ? '<button class="btn pri" id="kirim">' + ic('send', 20, 'currentColor', 2) + 'Kirim tantangan lewat Telegram</button>' : '<button class="btn pri" id="tolobi">Ke lobi duel</button>', { nav: false, top: dlHead('Langkah 2 dari 3') });
  dlBindBack();
  var k = document.getElementById('kirim');
  if (k) k.onclick = function () { dlShare('tantang', null, function () { renderTerkirim(); }); };
  var tl = document.getElementById('tolobi'); if (tl) tl.onclick = function () { openDuel(); };
}
// Tantang langkah 3: pratinjau yang diterima teman
function renderTerkirim() {
  var d = DL.one || {}, name = (S.me && S.me.name) || (DL.lobby && DL.lobby.name) || d.from || 'Kamu';
  var v = '<h1 class="h-title">Tantangan siap dikirim</h1><span class="mu" style="font-size:14px;line-height:1.5">Pilih teman atau grup belajar di daftar chat Telegram. Yang mereka terima seperti ini:</span>' +
    '<section class="tgprev"><span class="small" style="font-weight:700;color:#7FB8F0">' + esc(name) + ' via @mahir_pajak_bot</span>' +
      '<div style="border-radius:14px;background:var(--bg);border:1px solid var(--ln);padding:16px;display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--au)">DUEL PAJAK</span>' +
      '<span class="disp" style="font-size:22px;font-weight:800;line-height:1.15">' + esc(name) + ' menantangmu: 5 soal ' + esc(d.topic || '') + '</span><span class="s13 mu">Skornya dirahasiakan. Berani? Batas 24 jam.</span></div>' +
      '<div style="min-height:44px;border-radius:10px;background:#22344A;color:#CFE6FF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">Terima tantangan</div></section>' +
    '<span class="small mu" style="text-align:center;line-height:1.5">Teman yang belum pernah memakai bot langsung masuk lewat tombol itu.</span>';
  frame(v, '<div style="display:flex;flex-direction:column;gap:10px;flex:1"><button class="btn light" id="tolobi">Kembali ke lobi</button><button class="btn ghost" id="lagi">Kirim ke chat lain</button></div>', { nav: false, top: dlHead('Langkah 3 dari 3') });
  dlBindBack();
  document.getElementById('tolobi').onclick = function () { openDuel(); };
  document.getElementById('lagi').onclick = function () { dlShare('tantang', null, function () {}); };
}
// Bagikan lewat Telegram: pesan siap-kirim (Bot API 8.0), cadangan tautan bagikan biasa.
function dlShare(kind, o, done) {
  if (DL.busy) return; DL.busy = true; hap('medium');
  api('duel/share', { c: DL.code, kind: kind, o: o }).then(function (r) {
    DL.busy = false;
    var fb = function () { if (TG && TG.openTelegramLink) TG.openTelegramLink(r.fallback); else window.open(r.fallback, '_blank'); done && done(true); };
    if (r.id && TG && tgVer('8.0') && TG.shareMessage) {
      try { TG.shareMessage(r.id, function (sent) { if (sent) toast('Terkirim'); done && done(sent); }); } catch (e) { fb(); }
    } else fb();
  }).catch(function (e) {
    DL.busy = false; hap('error');
    toast(e.status === 409 ? 'Tantangan ini sudah lewat batas 24 jam' : 'Gagal menyiapkan kartu. Coba lagi.');
  });
}

// ---------- hasil ----------
function renderDuelResult() {
  var d = DL.one, r = DL.res;
  var SE = { win: ['MENANG', '#E4B860'], lose: ['KALAH', '#FF8A7A'], tie: ['SERI', '#9DAAA3'] }[r.outcome];
  var v = '<section class="card big" style="padding:22px 20px;display:flex;flex-direction:column;gap:16px">' +
      '<span class="eyebrow" style="font-size:12px;letter-spacing:.14em">Hasil duel · ' + esc(d.topic) + '</span>' +
      '<div class="score2"><div style="display:flex;flex-direction:column;gap:4px"><span class="s13" style="color:var(--ac2);font-weight:700">Kamu</span><span class="big">' + r.me.score + '</span><span class="small mu num">' + esc(r.me.timeText) + '</span></div>' +
        '<span class="mu" style="font-size:18px;padding-bottom:26px">–</span>' +
        '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="s13" style="color:var(--au);font-weight:700">' + esc(r.opp.name) + '</span><span class="big">' + r.opp.score + '</span><span class="small mu num">' + esc(r.opp.timeText) + '</span></div></div>' +
      '<div style="display:flex;justify-content:center"><div class="dseal" style="color:' + SE[1] + '" aria-label="' + SE[0] + '"><div>' + SE[0] + '</div></div></div>' +
      (r.byTime ? '<span class="s13 mu" style="text-align:center">Skor sama, ditentukan waktu.</span>' : '') + '</section>';
  if (r.notes.length) {
    v += '<section class="card" style="background:var(--warnbg);border:1.5px solid var(--warn);display:flex;flex-direction:column;gap:12px"><div class="row" style="gap:10px">' + ic('warn', 22, '#F2B04C', 2) + '<span style="font-size:15px;font-weight:800;color:var(--warn)">Catatan main bersih</span></div>' +
      r.notes.map(function (n) { return '<div style="display:flex;gap:10px;font-size:14px;line-height:1.5"><span style="flex:none;width:6px;height:6px;border-radius:3px;background:var(--warn);margin-top:8px"></span><span>' + n.replace(/<(?!\/?b>)[^>]*>/g, '') + '</span></div>'; }).join('') + '</section>';
  }
  v += '<section class="card row" style="align-items:flex-start"><div style="flex:none;width:36px;height:36px;border-radius:18px;background:var(--warnbg);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--au)">PT</div>' +
      '<div style="display:flex;flex-direction:column;gap:4px"><span class="small" style="font-weight:700;color:var(--au)">Pak Tegas</span><span style="font-size:14px;line-height:1.5">' + esc(r.roast) + '</span></div></section>';
  v += r.notes.length
    ? '<div class="row small mu" style="align-items:flex-start;gap:10px;padding:0 4px;line-height:1.5">' + ic('lock', 16, 'var(--mu)', 2) + '<span>Catatan ini hanya terlihat oleh kamu dan ' + esc(r.opp.name) + ', tidak ikut di kartu yang dibagikan ke grup.</span></div>'
    : '<div class="row s13 mu" style="gap:10px;padding:0 4px">' + ic('check', 18, '#5ED3A5', 2.4) + '<span>Main bersih: kamu dan ' + esc(r.opp.name) + ' tidak keluar aplikasi selama duel.</span></div>';
  v += '<button class="btn ghost" id="ulangd" style="flex:none">Tantang ' + esc(r.opp.name) + ' duel ulang</button>' +
    '<button class="s13" id="bahas" style="background:none;border:0;color:var(--ac);min-height:44px;font-weight:600">Lihat pembahasan soal</button>';
  frame(v, '<button class="btn pri" id="bagi">Bagikan kartu ke grup</button>', { nav: false, top: dlHead('Hasil duel') });
  dlBindBack();
  hap(r.outcome === 'win' ? 'ok' : r.outcome === 'lose' ? 'warning' : 'light');
  document.getElementById('bagi').onclick = function () { dlShare('hasil', r.oppUid, function () {}); };
  document.getElementById('ulangd').onclick = function () { if (DL.lobby) renderTantang(); else api('duel').then(function (d2) { DL.lobby = d2; renderTantang(); }).catch(function (e) { errorView(e, openDuel); }); };
  document.getElementById('bahas').onclick = renderBahas;
}
function renderBahas() {
  var r = DL.res;
  var v = '<h1 class="h-title">Pembahasan</h1>' + r.review.map(function (x, k) {
    var st = x.timeout ? 'Waktu habis' : x.ok ? 'Benar' : 'Salah';
    var os = x.opp.timeout ? 'waktu habis' : (x.opp.ok ? 'benar' : 'salah') + ' · ' + x.opp.t + ' dtk';
    return '<article class="card rv"><span class="badge" style="color:' + (x.ok ? 'var(--ac)' : 'var(--bad)') + '">Soal ' + (k + 1) + ' · ' + st + (x.timeout ? '' : ' · ' + x.t + ' dtk') + '</span>' +
      '<span class="s13" style="color:var(--au);font-weight:600">' + esc(r.opp.name) + ': ' + os + '</span>' +
      '<span class="eyebrow">' + esc(x.topic) + '</span><span style="font-size:14px;line-height:1.5;white-space:pre-wrap">' + esc(x.q) + '</span>' +
      (x.mine != null && !x.ok ? '<span class="s13 mu2" style="text-decoration:line-through;text-decoration-color:#FF8A7A88">Kamu: ' + L[x.mine] + '. ' + esc(x.options[x.mine]) + '</span>' : '') +
      '<span class="s13" style="color:var(--ac);font-weight:600">' + L[x.right] + '. ' + esc(x.options[x.right]) + '</span>' +
      '<span class="s13 mu" style="line-height:1.55;white-space:pre-wrap">' + esc(x.explain) + (x.basis ? '\n<i>Dasar: ' + esc(x.basis) + '</i>' : '') + '</span></article>';
  }).join('');
  frame(v, '<button class="btn ghost" id="kembali">Kembali ke hasil</button>', { nav: false, top: dlHead('Hasil duel') });
  dlBindBack(renderDuelResult);
  document.getElementById('kembali').onclick = renderDuelResult;
}

// ---------- mulai ----------
var p = qs.get('p') || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || 'beranda';
if (!INIT) { errorView({ status: 401 }); return; }
if (p === 'materi') go('materi', { t: qs.get('t') || undefined, s: qs.get('s') != null ? Number(qs.get('s')) : undefined });
else if (p === 'duel') go('duel', qs.get('c') ? { c: qs.get('c'), o: qs.get('o') || null } : null);
else if (['beranda', 'rapor', 'simulasi', 'tabel', 'kesalahan'].indexOf(p) >= 0) go(p);
else go('beranda');
})();
</script>
